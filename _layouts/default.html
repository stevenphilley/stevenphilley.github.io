<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{% include meta.html %}

<!-- Apply URL/local theme before first paint so there's no flash -->
<script src="{{ '/js/sp-theme-boot.js' | relative_url }}"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/css/sp-nav.css' | relative_url }}" />
{%- assign sp_here = page.url | replace: 'index.html', '' -%}
{%- if sp_here == '/' or sp_here == '//' or sp_here == '' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Steven Philley",
  "url": "https://stevenphilley.com/",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://stevenphilley.com/search/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
{%- endif -%}
</head>

<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="border-left" aria-hidden="true"></div>
<div class="border-right" aria-hidden="true"></div>

<div class="page-wrap">

  {% include nav.html %}
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{% include meta.html %}

<!-- Apply the saved theme before first paint so there's no flash -->
<script>
(function () {
  try {
    var t = localStorage.getItem('sp-theme');
    if (t && ['dusk', 'sage', 'tide', 'sand'].indexOf(t) > -1) {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
</head>

<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="border-left" aria-hidden="true"></div>
<div class="border-right" aria-hidden="true"></div>

<div class="page-wrap">

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

</div>

</body>
</html>

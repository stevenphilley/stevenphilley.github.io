<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggestions — Steven Philley</title>
<meta name="description" content="Public ideas for stevenphilley.com — Yes builds them, Later parks them here, No declines.">
<link rel="canonical" href="https://stevenphilley.com/suggestions/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Steven Philley">
<meta property="og:title" content="Suggestions — Steven Philley">
<meta property="og:description" content="Public ideas for the site; Yes builds them, Later parks them here, No declines.">
<meta property="og:url" content="https://stevenphilley.com/suggestions/">
<meta property="og:image" content="https://stevenphilley.com/images/og/og-home.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Suggestions — Steven Philley">
<meta name="twitter:image" content="https://stevenphilley.com/images/og/og-home.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{background:var(--base-2,#14161c);color:var(--ink,#e8e6e1)}
.e-wrap{max-width:920px;margin:0 auto;padding:0 clamp(20px,5vw,64px) 72px}
.e-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line,#2c303a);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.e-top a{color:var(--ink-soft,#9b9a96);text-decoration:none}
.e-top a:hover,.e-top a[aria-current="page"]{color:inherit}
.e-hero{padding:clamp(36px,6vw,72px) 0 22px;border-bottom:1px solid var(--line,#2c303a)}
.e-kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent,#c8b48a);margin:0 0 12px}
.e-hero h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(52px,11vw,108px);line-height:.88;margin:0}
.e-hero .lede{max-width:58ch;margin:18px 0 0;font-family:"IBM Plex Mono",monospace;font-size:13.5px;line-height:1.7;color:var(--ink-soft,#9b9a96)}
.e-hero .lede a{color:var(--ink,#e8e6e1);text-decoration:underline;text-underline-offset:3px}
.e-hero .lede a:hover{color:var(--accent,#c8b48a)}
.themes{display:flex;gap:0;border:1px solid var(--line,#2c303a)}
.themes button{appearance:none;background:transparent;border:0;border-right:1px solid var(--line,#2c303a);color:var(--muted,#63666e);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;padding:5px 10px;cursor:pointer;text-transform:uppercase}
.themes button:last-child{border-right:0}
.themes button[aria-pressed="true"]{color:var(--base-2,#14161c);background:var(--ink,#e8e6e1)}
.cta{margin:22px 0 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cta a.btn{appearance:none;background:var(--ink,#e8e6e1);color:var(--base-2,#14161c);border:1px solid var(--ink,#e8e6e1);font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:12px 22px;text-decoration:none}
.cta a.btn:hover{background:var(--accent,#c8b48a);border-color:var(--accent,#c8b48a)}
.cta a.ghost{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;color:var(--ink-soft,#9b9a96);text-decoration:none}
.cta a.ghost:hover{color:var(--accent,#c8b48a)}
.band{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent,#c8b48a);margin:40px 0 14px;display:flex;align-items:center;gap:14px}
.band::after{content:"";flex:1;height:1px;background:var(--line,#2c303a)}
.band.quiet{color:var(--muted,#63666e);margin-top:32px}
.list{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line,#2c303a);background:rgba(0,0,0,.14);padding:18px 18px 16px}
.card.quiet{opacity:.78}
.card .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px}
.badge{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line,#2c303a)}
.badge.pending{color:#e8c96a;border-color:color-mix(in srgb,#e8c96a 55%,var(--line,#2c303a));background:color-mix(in srgb,#e8c96a 12%,transparent)}
.badge.later{color:#7eb8e8;border-color:color-mix(in srgb,#7eb8e8 55%,var(--line,#2c303a));background:color-mix(in srgb,#7eb8e8 12%,transparent)}
.badge.approved{color:#8fd4a0;border-color:color-mix(in srgb,#8fd4a0 55%,var(--line,#2c303a));background:color-mix(in srgb,#8fd4a0 12%,transparent)}
.badge.done{color:#a8a6a1;border-color:color-mix(in srgb,#a8a6a1 45%,var(--line,#2c303a));background:color-mix(in srgb,#a8a6a1 10%,transparent)}
.badge.declined{color:#e08a8a;border-color:color-mix(in srgb,#e08a8a 45%,var(--line,#2c303a));background:color-mix(in srgb,#e08a8a 10%,transparent)}
.card h2{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:14px;line-height:1.55;margin:0 0 8px;color:var(--ink,#e8e6e1)}
.card .note{margin:0 0 8px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.6;color:var(--ink-soft,#9b9a96)}
.card .foot{margin:0;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--muted,#63666e);display:flex;flex-wrap:wrap;gap:8px 14px}
.card .foot a{color:var(--ink-soft,#9b9a96);text-decoration:none}
.card .foot a:hover{color:var(--accent,#c8b48a)}
.empty{margin:28px 0 0;padding:18px;border:1px dashed var(--line,#2c303a);font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.65;color:var(--ink-soft,#9b9a96)}
.empty a{color:var(--ink,#e8e6e1)}
.declined-wrap{margin-top:28px;border:1px solid var(--line,#2c303a)}
.declined-wrap summary{cursor:pointer;list-style:none;padding:14px 16px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted,#63666e);display:flex;justify-content:space-between;gap:12px}
.declined-wrap summary::-webkit-details-marker{display:none}
.declined-wrap[open] summary{border-bottom:1px solid var(--line,#2c303a);color:var(--ink-soft,#9b9a96)}
.declined-wrap .inner{padding:14px;display:flex;flex-direction:column;gap:10px}
.e-foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line,#2c303a);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--muted,#63666e);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.e-foot a{color:var(--ink-soft,#9b9a96);text-decoration:none}
</style>
</head>
<body>
<div class="e-wrap">
  <div class="e-top">
    <a href="/">Steven Philley</a>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <a href="/sitemap.html">Sitemap</a>
      <a href="/suggest/">Suggest</a>
      <a href="/suggestions/" aria-current="page">Suggestions</a>
      <div class="themes" role="group" aria-label="Color theme">
        <button type="button" data-set-theme="neon">Neon</button>
        <button type="button" data-set-theme="emerald">Emerald</button>
        <button type="button" data-set-theme="dusk">Dusk</button>
        <button type="button" data-set-theme="sage">Sage</button>
        <button type="button" data-set-theme="tide">Tide</button>
        <button type="button" data-set-theme="sand">Sand</button>
      </div>
    </div>
  </div>

  <header class="e-hero">
    <p class="e-kicker">Site — Public board</p>
    <h1>Suggestions</h1>
    <p class="lede">Public ideas for stevenphilley.com. Yes builds them; Later parks them here; No declines. Add yours on <a href="/suggest/">/suggest/</a>.</p>
    <div class="cta">
      <a class="btn" href="/suggest/">Add a suggestion</a>
      <a class="ghost" href="/sitemap.html">Site contents</a>
    </div>
  </header>

  <div id="board" aria-live="polite">
    <p class="empty">Loading suggestions…</p>
  </div>

  <footer class="e-foot">
    <a href="/">Home</a>
    <a href="/suggest/">Suggest</a>
    <a href="/sitemap.html">Sitemap</a>
    <a href="/themes/">Themes</a>
  </footer>
</div>
<script>
(function(){
  var KEY='sp-theme';
  var root=document.documentElement;
  var buttons=[].slice.call(document.querySelectorAll('[data-set-theme]'));
  function paintTheme(){
    var cur=root.getAttribute('data-theme')||'neon';
    buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.setTheme===cur));});
  }
  buttons.forEach(function(b){
    b.addEventListener('click',function(){
      root.setAttribute('data-theme',b.dataset.setTheme);
      try{localStorage.setItem(KEY,b.dataset.setTheme);}catch(e){}
      paintTheme();
    });
  });
  paintTheme();

  var STATUS_LABEL={
    pending:'Pending',
    later:'Later',
    approved:'Approved',
    done:'Done',
    declined:'Declined'
  };

  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function safeHref(url){
    if(!url) return '';
    var u=String(url).trim();
    if(/^https?:\/\//i.test(u) || u.charAt(0)==='/') return u;
    return '';
  }

  function cardHtml(item, quiet){
    var st=(item.status||'pending').toLowerCase();
    if(!STATUS_LABEL[st]) st='pending';
    var href=safeHref(item.page);
    var pageBit=href?'<a href="'+esc(href)+'">'+esc(item.page)+'</a>':'';
    var nameBit=item.name?esc(item.name):'Anonymous';
    var note=item.note?'<p class="note">'+esc(item.note)+'</p>':'';
    var dates=[];
    if(item.submitted) dates.push('Submitted '+esc(item.submitted));
    if(item.updated) dates.push('Updated '+esc(item.updated));
    return '<article class="card'+(quiet?' quiet':'')+'">'
      +'<div class="meta"><span class="badge '+st+'">'+STATUS_LABEL[st]+'</span></div>'
      +'<h2>'+esc(item.suggestion||'(no text)')+'</h2>'
      +note
      +'<p class="foot"><span>'+nameBit+'</span>'+(pageBit?pageBit:'')+(dates.length?'<span>'+dates.join(' · ')+'</span>':'')+'</p>'
      +'</article>';
  }

  function render(items){
    var board=document.getElementById('board');
    if(!Array.isArray(items) || !items.length){
      board.innerHTML='<p class="empty">No suggestions on the board yet. <a href="/suggest/">Send one</a> — Later and Pending show up here.</p>';
      return;
    }
    var open=[], motion=[], declined=[];
    items.forEach(function(it){
      var st=(it.status||'pending').toLowerCase();
      if(st==='later' || st==='pending') open.push(it);
      else if(st==='approved' || st==='done') motion.push(it);
      else if(st==='declined') declined.push(it);
      else open.push(it);
    });
    var html='';
    html+='<p class="band">Later + Pending</p>';
    if(open.length){
      html+='<div class="list">'+open.map(function(it){return cardHtml(it,false);}).join('')+'</div>';
    }else{
      html+='<p class="empty">Nothing parked or waiting. <a href="/suggest/">Add an idea</a>.</p>';
    }
    html+='<p class="band quiet">In motion / shipped</p>';
    if(motion.length){
      html+='<div class="list">'+motion.map(function(it){return cardHtml(it,true);}).join('')+'</div>';
    }else{
      html+='<p class="empty">No approved or done items yet.</p>';
    }
    if(declined.length){
      html+='<details class="declined-wrap"><summary><span>Declined</span><span>'+declined.length+'</span></summary><div class="inner list">'
        +declined.map(function(it){return cardHtml(it,true);}).join('')
        +'</div></details>';
    }
    board.innerHTML=html;
  }

  fetch('data.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('bad status'); return r.json(); })
    .then(render)
    .catch(function(){
      document.getElementById('board').innerHTML='<p class="empty">Couldn’t load the board right now. Try again in a moment, or <a href="/suggest/">send a suggestion</a> anyway.</p>';
    });
})();
</script>
<script src="/js/sp-share.js" defer></script>
</body>
</html>

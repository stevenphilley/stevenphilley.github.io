<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OG Cards — stevenphilley.com</title>

<!-- The real site stylesheet, so the generator can read the actual Dusk tokens. -->
<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ui-bg: #14131a;
    --ui-ink: #f3efe6;
    --ui-dim: #8d869a;
    --ui-line: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 32px 96px;
    background: var(--ui-bg);
    color: var(--ui-ink);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 1320px; margin: 0 auto; }
  h1 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 56px;
    letter-spacing: .04em;
    margin: 0 0 4px;
  }
  .lede { color: var(--ui-dim); max-width: 62ch; margin: 0 0 32px; }
  .panel {
    border: 1px solid var(--ui-line);
    border-left: 6px solid var(--ui-ink);
    padding: 20px 24px;
    margin-bottom: 40px;
  }
  .panel h2 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 24px; letter-spacing: .12em; margin: 0 0 14px; font-weight: 400;
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-end; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .swatch label {
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ui-dim);
  }
  .swatch input[type=color] {
    width: 84px; height: 40px; padding: 0; border: 1px solid var(--ui-line);
    background: none; cursor: pointer;
  }
  .source { font-size: 11px; color: var(--ui-dim); margin-top: 14px; letter-spacing: .04em; }
  button {
    font-family: inherit; font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    background: none; color: var(--ui-ink); border: 1px solid currentColor;
    padding: 10px 18px; cursor: pointer;
  }
  button:hover { background: var(--ui-ink); color: var(--ui-bg); }
  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 36px; }
  .cards { display: grid; gap: 40px; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); }
  .card figure { margin: 0; }
  .card canvas {
    width: 100%; height: auto; display: block;
    border: 1px solid var(--ui-line);
  }
  .card figcaption {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    margin-top: 12px; color: var(--ui-dim); font-size: 12px;
  }
  .card figcaption code { color: var(--ui-ink); }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <h1>OG Cards</h1>
  <p class="lede">
    Renders a 1200&times;630 preview image for every page on the site, using the live Dusk
    tokens from <code>style.css</code> and the site fonts. Download them into
    <code>/images/og/</code> and point each page's <code>og:image</code> at the matching file.
  </p>

  <div class="panel">
    <h2>Palette</h2>
    <div class="swatches">
      <div class="swatch"><label for="c-bg">Background</label><input type="color" id="c-bg" value="#1c1a24"></div>
      <div class="swatch"><label for="c-ink">Ink</label><input type="color" id="c-ink" value="#f2ede4"></div>
      <div class="swatch"><label for="c-accent">Accent</label><input type="color" id="c-accent" value="#d98e5a"></div>
      <div class="swatch"><label for="c-muted">Muted</label><input type="color" id="c-muted" value="#8a8296"></div>
    </div>
    <p class="source" id="source-note">Reading theme tokens&hellip;</p>
  </div>

  <div class="toolbar">
    <button id="download-all">Download all</button>
    <button id="repaint">Repaint</button>
  </div>

  <div class="cards" id="cards"></div>
</div>

<script>
const W = 1200, H = 630;

const CARDS = [
  {
    file: "og-home",
    num: "01",
    title: "Photography",
    tagline: "Landscape & Natural Light",
    desc: "Nine photographs from the Northern California coast and countryside, sequenced warm to cool.",
    foot: "VOL. I — CALIFORNIA LIGHT"
  },
  {
    file: "og-sitemap",
    num: "—",
    title: "Contents",
    tagline: "The Index",
    desc: "One portfolio and six tools. Every page a single file that runs entirely in the browser.",
    foot: "VOL. II — THE INDEX"
  },
  {
    file: "og-circular-calendar",
    num: "02",
    title: "Annual Dial",
    tagline: "A calendar built like a clock",
    desc: "Read the whole year as one engraved dial, or switch to a single month with live hands.",
    foot: "A SINGLE HTML FILE · NO DEPENDENCIES"
  },
  {
    file: "og-marketpulse",
    num: "03",
    title: "MarketPulse",
    tagline: "A finance terminal",
    desc: "Live crypto prices with a scrolling ticker, index snapshots, and headlines from seven feeds.",
    foot: "A SINGLE HTML FILE · NO DEPENDENCIES"
  },
  {
    file: "og-percent-calculator",
    num: "04",
    title: "Percentages",
    tagline: "Three kinds of percent math",
    desc: "Percent of a number, one number as a percent of another, and the change between two figures.",
    foot: "A SINGLE HTML FILE · NO DEPENDENCIES"
  },
  {
    file: "og-pomodoro",
    num: "05",
    title: "Pomodoro",
    tagline: "A focus timer",
    desc: "Three sessions, each with its own color. Set your own durations; a chime marks every round.",
    foot: "A SINGLE HTML FILE · NO DEPENDENCIES"
  },
  {
    file: "og-typing-tutor",
    num: "06",
    title: "Stilltype",
    tagline: "A quiet typing tutor",
    desc: "Three difficulty levels, a beginner mode that drills the keys you choose, and a pace chart at the end.",
    foot: "A SINGLE HTML FILE · NO DEPENDENCIES"
  },
  {
    file: "og-chakras",
    num: "07",
    title: "Nine Chakras",
    tagline: "The tantric subtle body",
    desc: "Name, meaning, element, seed sound, and the qualities each governs, with petal marks drawn to scale.",
    foot: "A SINGLE HTML FILE · NO DEPENDENCIES"
  }
];

/* ---- Read the real Dusk tokens out of style.css, with fallbacks ---- */
const CANDIDATES = {
  bg:     ["--bg", "--background", "--paper", "--surface", "--color-bg", "--bg-0", "--page"],
  ink:    ["--ink", "--text", "--fg", "--foreground", "--color-text", "--type"],
  accent: ["--accent", "--accent-1", "--highlight", "--color-accent", "--rule-strong", "--brand"],
  muted:  ["--muted", "--dim", "--text-muted", "--subtle", "--color-muted", "--faint"]
};

function probeTokens() {
  const probe = document.createElement("div");
  probe.setAttribute("data-theme", "dusk");
  probe.style.cssText = "position:absolute;left:-9999px;top:0;width:1px;height:1px;";
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  const found = {}, names = {};
  for (const key in CANDIDATES) {
    for (const name of CANDIDATES[key]) {
      const v = cs.getPropertyValue(name).trim();
      if (v) { found[key] = v; names[key] = name; break; }
    }
  }
  probe.remove();
  return { found, names };
}

/* Normalise any CSS color to hex so <input type=color> accepts it. */
function toHex(color) {
  if (!color) return null;
  const probe = document.createElement("canvas").getContext("2d");
  probe.fillStyle = "#000";
  probe.fillStyle = color;
  const resolved = probe.fillStyle;
  return /^#[0-9a-f]{6}$/i.test(resolved) ? resolved : null;
}

function applyProbedTokens() {
  const { found, names } = probeTokens();
  const note = document.getElementById("source-note");
  const picked = [];
  for (const key in found) {
    const hex = toHex(found[key]);
    if (hex) {
      document.getElementById("c-" + key).value = hex;
      picked.push(names[key]);
    }
  }
  note.textContent = picked.length
    ? "Read from style.css: " + picked.join(", ") + ". Adjust above if a token mapped to the wrong role."
    : "No matching custom properties found in style.css — using the fallback palette. Adjust above.";
}

function palette() {
  return {
    bg:     document.getElementById("c-bg").value,
    ink:    document.getElementById("c-ink").value,
    accent: document.getElementById("c-accent").value,
    muted:  document.getElementById("c-muted").value
  };
}

/* ---- Canvas helpers ---- */
function setTracking(ctx, em, px) {
  if ("letterSpacing" in ctx) ctx.letterSpacing = (em * px).toFixed(2) + "px";
}
function clearTracking(ctx) {
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}
function fitText(ctx, text, maxWidth, startSize, family, weight) {
  let size = startSize;
  do {
    ctx.font = `${weight} ${size}px ${family}`;
    if (ctx.measureText(text).width <= maxWidth) break;
    size -= 2;
  } while (size > 24);
  return size;
}
function wrapLines(ctx, text, maxWidth, maxLines) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = "";
  for (const word of words) {
    const next = line ? line + " " + word : word;
    if (ctx.measureText(next).width > maxWidth && line) {
      lines.push(line);
      line = word;
      if (lines.length === maxLines) break;
    } else {
      line = next;
    }
  }
  if (lines.length < maxLines && line) lines.push(line);
  if (lines.length === maxLines) {
    let last = lines[maxLines - 1];
    if (ctx.measureText(last).width > maxWidth) {
      while (last.length && ctx.measureText(last + "…").width > maxWidth) {
        last = last.slice(0, -1);
      }
      lines[maxLines - 1] = last.replace(/[\s,.;:—-]+$/, "") + "…";
    }
  }
  return lines;
}
function hexAlpha(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function paint(canvas, card) {
  const p = palette();
  const ctx = canvas.getContext("2d");
  const PAD = 96;
  const RIGHT = W - PAD;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = p.bg;
  ctx.fillRect(0, 0, W, H);

  // Heavy left rule, echoing the site's side borders.
  ctx.fillStyle = p.accent;
  ctx.fillRect(0, 0, 28, H);

  ctx.textBaseline = "alphabetic";

  // Kicker
  ctx.fillStyle = p.accent;
  ctx.font = '500 22px "IBM Plex Mono", monospace';
  setTracking(ctx, 0.26, 22);
  ctx.textAlign = "left";
  ctx.fillText("STEVENPHILLEY.COM", PAD, 112);
  clearTracking(ctx);

  // Page number, top right
  ctx.fillStyle = hexAlpha(p.muted, 0.85);
  ctx.font = '400 84px "Bebas Neue", Impact, sans-serif';
  ctx.textAlign = "right";
  ctx.fillText(card.num, RIGHT, 122);
  ctx.textAlign = "left";

  // Upper rule
  ctx.strokeStyle = hexAlpha(p.muted, 0.35);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, 152.5); ctx.lineTo(RIGHT, 152.5); ctx.stroke();

  // Title
  const titleSize = fitText(ctx, card.title, RIGHT - PAD, 132, '"Bebas Neue", Impact, sans-serif', 400);
  ctx.font = `400 ${titleSize}px "Bebas Neue", Impact, sans-serif`;
  setTracking(ctx, 0.02, titleSize);
  ctx.fillStyle = p.ink;
  ctx.fillText(card.title, PAD, 322);
  clearTracking(ctx);

  // Tagline
  ctx.font = '500 27px "IBM Plex Mono", monospace';
  ctx.fillStyle = p.accent;
  ctx.fillText(card.tagline, PAD, 372);

  // Description, up to two lines
  ctx.font = '400 23px "IBM Plex Mono", monospace';
  ctx.fillStyle = hexAlpha(p.ink, 0.72);
  const lines = wrapLines(ctx, card.desc, RIGHT - PAD, 2);
  lines.forEach((line, i) => ctx.fillText(line, PAD, 446 + i * 36));

  // Lower rule
  ctx.strokeStyle = hexAlpha(p.muted, 0.35);
  ctx.beginPath(); ctx.moveTo(PAD, 538.5); ctx.lineTo(RIGHT, 538.5); ctx.stroke();

  // Footer
  ctx.font = '400 17px "IBM Plex Mono", monospace';
  setTracking(ctx, 0.2, 17);
  ctx.fillStyle = hexAlpha(p.muted, 0.9);
  ctx.fillText(card.foot, PAD, 578);
  clearTracking(ctx);
}

function download(canvas, name) {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name + ".png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, "image/png");
}

function build() {
  const host = document.getElementById("cards");
  host.innerHTML = "";
  CARDS.forEach(card => {
    const wrap = document.createElement("div");
    wrap.className = "card";

    const fig = document.createElement("figure");
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    fig.appendChild(canvas);

    const cap = document.createElement("figcaption");
    const label = document.createElement("span");
    label.innerHTML = "<code>/images/og/" + card.file + ".png</code>";
    const btn = document.createElement("button");
    btn.textContent = "Download";
    btn.addEventListener("click", () => download(canvas, card.file));
    cap.append(label, btn);

    fig.appendChild(cap);
    wrap.appendChild(fig);
    host.appendChild(wrap);

    card._canvas = canvas;
    paint(canvas, card);
  });
}

function repaintAll() {
  CARDS.forEach(card => card._canvas && paint(card._canvas, card));
}

document.getElementById("repaint").addEventListener("click", repaintAll);
["c-bg", "c-ink", "c-accent", "c-muted"].forEach(id =>
  document.getElementById(id).addEventListener("input", repaintAll)
);
document.getElementById("download-all").addEventListener("click", () => {
  CARDS.forEach((card, i) =>
    setTimeout(() => download(card._canvas, card.file), i * 350)
  );
});

(async function init() {
  applyProbedTokens();
  try {
    await Promise.all([
      document.fonts.load('400 132px "Bebas Neue"'),
      document.fonts.load('400 23px "IBM Plex Mono"'),
      document.fonts.load('500 27px "IBM Plex Mono"')
    ]);
    await document.fonts.ready;
  } catch (e) {
    /* Fonts unavailable — fall through and paint with the fallback stack. */
  }
  build();
})();
</script>
</body>
</html>

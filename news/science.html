<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science News — Steven Philley</title>
<meta name="description" content="Science headlines from BBC, NASA, Phys.org, and ScienceDaily via public RSS feeds.">
<link rel="canonical" href="https://stevenphilley.com/news/science.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Steven Philley">
<meta property="og:title" content="Science News — Steven Philley">
<meta property="og:description" content="Science headlines from BBC, NASA, Phys.org, and ScienceDaily.">
<meta property="og:url" content="https://stevenphilley.com/news/science.html">
<meta property="og:image" content="https://stevenphilley.com/images/og/og-home.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Science News — Steven Philley">
<meta name="twitter:image" content="https://stevenphilley.com/images/og/og-home.png">
<script>(function(){try{var t=localStorage.getItem('sp-theme');if(t&&['dusk','sage','tide','sand'].indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
:root,[data-theme="dusk"]{--bg:#14161c;--ink:#e8e6e1;--dim:#9b9a96;--faint:#63666e;--rule:#2c303a;--accent:#c8b48a;--surface:#1b1e26}
[data-theme="sage"]{--bg:#eceee7;--ink:#23291f;--dim:#5c6355;--faint:#8c9384;--rule:#c8ccbe;--accent:#5b7a4e;--surface:#e2e5db}
[data-theme="tide"]{--bg:#0f1a20;--ink:#e2ecef;--dim:#8fa5ad;--faint:#5c737d;--rule:#243740;--accent:#6fb3c4;--surface:#16232b}
[data-theme="sand"]{--bg:#f2ede3;--ink:#2a251d;--dim:#655e51;--faint:#948b7b;--rule:#d5ccba;--accent:#a8622f;--surface:#e9e2d4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;line-height:1.6}
a{color:inherit}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px clamp(16px,4vw,48px);border-bottom:1px solid var(--rule);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.top a{color:var(--dim);text-decoration:none}
.top a:hover,.top a[aria-current="page"]{color:var(--ink)}
.top-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.themes{display:flex;border:1px solid var(--rule)}
.themes button{appearance:none;background:transparent;border:0;border-right:1px solid var(--rule);color:var(--faint);font:inherit;font-size:10px;letter-spacing:.1em;padding:5px 9px;cursor:pointer;text-transform:uppercase}
.themes button:last-child{border-right:0}
.themes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{padding:clamp(36px,6vw,72px) clamp(16px,4vw,48px) 28px;border-bottom:1px solid var(--rule)}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
.hero h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(48px,10vw,96px);line-height:.9;margin:0}
.lede{max-width:56ch;margin:16px 0 0;color:var(--dim);font-size:13.5px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:60vh}
@media (max-width:800px){.layout{grid-template-columns:1fr}}
.rail{border-right:1px solid var(--rule);padding:20px clamp(16px,3vw,28px)}
@media (max-width:800px){.rail{border-right:0;border-bottom:1px solid var(--rule);padding-bottom:8px}}
.rail h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 12px;font-weight:500}
.tabs{display:flex;flex-direction:column;gap:4px}
@media (max-width:800px){.tabs{flex-direction:row;flex-wrap:wrap}}
.tab{appearance:none;background:transparent;border:1px solid transparent;color:var(--dim);text-align:left;font:inherit;font-size:12px;letter-spacing:.08em;padding:10px 12px;cursor:pointer}
.tab:hover{color:var(--ink);border-color:var(--rule)}
.tab[aria-selected="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.main{padding:20px clamp(16px,4vw,48px) 64px}
.status{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 16px;min-height:1.2em}
.status[data-state="error"]{color:#c45c5c}
.status[data-state="stale"]{color:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.item{border-top:1px solid var(--rule);padding:18px 0}
.item:last-child{border-bottom:1px solid var(--rule)}
.item a{text-decoration:none;display:block}
.item a:hover .ttl{color:var(--accent)}
.ttl{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(22px,3.5vw,32px);line-height:1.05;margin:0 0 8px;letter-spacing:.01em}
.meta{font-size:11px;letter-spacing:.08em;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}
.empty{padding:40px 0;color:var(--dim);border-top:1px solid var(--rule)}
.skel{height:18px;background:var(--surface);margin:14px 0;opacity:.7}
</style>
</head>
<body>
  <div class="top">
    <a href="/">Steven Philley</a>
    <div class="top-right">
      <a href="/news/">News sitemap</a>
      <a href="/markets/">Markets</a>
      <a href="/sitemap.html">Site contents</a>
      <div class="themes" role="group" aria-label="Color theme">
        <button type="button" data-set-theme="dusk">Dusk</button>
        <button type="button" data-set-theme="sage">Sage</button>
        <button type="button" data-set-theme="tide">Tide</button>
        <button type="button" data-set-theme="sand">Sand</button>
      </div>
    </div>
  </div>

  <header class="hero">
    <p class="kicker">News / Science</p>
    <h1>Science</h1>
    <p class="lede">Public RSS desks only — no API keys. If one relay is down, the page tries the next.</p>
  </header>

  <div class="layout">
    <aside class="rail">
      <h2>Sources</h2>
      <div class="tabs" id="tabs" role="tablist" aria-label="Science feeds"></div>
    </aside>
    <main class="main">
      <p class="status" id="status">Loading…</p>
      <ul class="list" id="list" aria-live="polite"></ul>
    </main>
  </div>

<script>
(function(){
  'use strict';

  var SITE = ['dusk','sage','tide','sand'];
  var root = document.documentElement;
  var themeBtns = [].slice.call(document.querySelectorAll('[data-set-theme]'));
  function paintTheme(){
    var c = root.getAttribute('data-theme') || 'dusk';
    themeBtns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.setTheme === c)); });
  }
  themeBtns.forEach(function(b){
    b.addEventListener('click', function(){
      root.setAttribute('data-theme', b.dataset.setTheme);
      try { localStorage.setItem('sp-theme', b.dataset.setTheme); } catch(e) {}
      paintTheme();
    });
  });
  paintTheme();

  var FEEDS = [
    { id:'bbc',  label:'BBC Science', url:'https://feeds.bbci.co.uk/news/science_and_environment/rss.xml' },
    { id:'nasa', label:'NASA',        url:'https://www.nasa.gov/rss/dyn/breaking_news.rss' },
    { id:'phys', label:'Phys.org',    url:'https://phys.org/rss-feed/' },
    { id:'sd',   label:'ScienceDaily',url:'https://www.sciencedaily.com/rss/top.xml' }
  ];

  var tabs = document.getElementById('tabs');
  var list = document.getElementById('list');
  var status = document.getElementById('status');
  var active = FEEDS[0];
  try {
    var saved = localStorage.getItem('news-science-feed');
    var hit = FEEDS.find(function(f){ return f.id === saved; });
    if (hit) active = hit;
  } catch(e) {}

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function proxies(url){
    return [
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
      'https://api.allorigins.win/get?url=' + encodeURIComponent(url)
    ];
  }

  async function fetchText(url){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 7000);
    try {
      var res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var ct = (res.headers.get('content-type') || '').toLowerCase();
      if (ct.indexOf('application/json') > -1 || url.indexOf('/get?url=') > -1) {
        var j = await res.json();
        if (j && typeof j.contents === 'string') return j.contents;
        throw new Error('unexpected JSON');
      }
      return await res.text();
    } finally {
      clearTimeout(timer);
    }
  }

  async function loadXml(feedUrl){
    var lastErr;
    var list = proxies(feedUrl);
    for (var i = 0; i < list.length; i++) {
      try {
        var xml = await fetchText(list[i]);
        if (!xml || xml.indexOf('<') === -1) throw new Error('empty relay');
        return xml;
      } catch (err) {
        lastErr = err;
      }
    }
    throw lastErr || new Error('all relays failed');
  }

  function parseItems(xml){
    var doc = new DOMParser().parseFromString(xml, 'text/xml');
    if (doc.querySelector('parsererror')) throw new Error('could not parse feed');
    var nodes = [].slice.call(doc.querySelectorAll('item, entry')).slice(0, 25);
    return nodes.map(function(n){
      var titleEl = n.querySelector('title');
      var linkEl = n.querySelector('link');
      var dateEl = n.querySelector('pubDate, updated, published, dc\\:date');
      var link = '';
      if (linkEl) {
        link = (linkEl.getAttribute('href') || linkEl.textContent || '').trim();
      }
      return {
        title: titleEl ? titleEl.textContent.trim() : '(untitled)',
        link: link,
        date: dateEl ? dateEl.textContent.trim() : ''
      };
    }).filter(function(it){ return it.title; });
  }

  function fmtDate(s){
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d.getTime())) return s;
    return d.toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function skeleton(){
    list.innerHTML = '<li class="skel"></li><li class="skel"></li><li class="skel"></li><li class="skel"></li><li class="skel"></li>';
  }

  function render(items, state){
    status.dataset.state = state || 'ok';
    if (!items || !items.length) {
      status.textContent = 'No headlines from this source right now.';
      list.innerHTML = '<li class="empty">Try another tab, or refresh in a minute.</li>';
      return;
    }
    status.textContent = items.length + ' headlines · ' + active.label;
    list.innerHTML = items.map(function(it){
      var href = it.link || '#';
      return '<li class="item"><a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
        '<h3 class="ttl">' + esc(it.title) + '</h3>' +
        '<div class="meta"><span>' + esc(active.label) + '</span><span>' + esc(fmtDate(it.date)) + '</span></div>' +
        '</a></li>';
    }).join('');
  }

  var snapshot = null;

  async function loadSnapshot(){
    if (snapshot) return snapshot;
    var res = await fetch('/news/science.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('snapshot HTTP ' + res.status);
    snapshot = await res.json();
    return snapshot;
  }

  function snapshotItems(feed){
    var pack = snapshot && snapshot.feeds && snapshot.feeds[feed.id];
    return (pack && pack.items) || [];
  }

  async function show(feed){
    active = feed;
    try { localStorage.setItem('news-science-feed', feed.id); } catch(e) {}
    [].slice.call(tabs.querySelectorAll('.tab')).forEach(function(b){
      var on = b.dataset.id === feed.id;
      b.setAttribute('aria-selected', String(on));
    });
    status.dataset.state = 'ok';
    status.textContent = 'Loading ' + feed.label + '…';
    skeleton();

    var shown = false;
    try {
      await loadSnapshot();
      var snap = snapshotItems(feed);
      if (snap.length) {
        status.dataset.state = 'stale';
        status.textContent = snap.length + ' headlines · ' + feed.label;
        render(snap, 'ok');
        shown = true;
      }
    } catch (e) {}

    try {
      var xml = await loadXml(feed.url);
      var items = parseItems(xml);
      if (!items.length) throw new Error('feed returned no items');
      try { localStorage.setItem('news-science-cache:' + feed.id, JSON.stringify({ t: Date.now(), items: items })); } catch(e) {}
      render(items, 'ok');
      shown = true;
    } catch (err) {
      if (shown) return;
      var cached = null;
      try {
        var raw = localStorage.getItem('news-science-cache:' + feed.id);
        if (raw) cached = JSON.parse(raw);
      } catch(e) {}
      if (cached && cached.items && cached.items.length) {
        status.dataset.state = 'stale';
        status.textContent = 'Showing cached headlines — ' + ((err && err.message) || 'source unavailable');
        render(cached.items, 'stale');
      } else {
        status.dataset.state = 'error';
        status.textContent = 'Could not load feed — ' + ((err && err.message) || 'unavailable');
        list.innerHTML = '<li class="empty">The public RSS relays may be rate-limiting. Try another source or come back shortly.</li>';
      }
    }
  }

  tabs.innerHTML = FEEDS.map(function(f){
    return '<button class="tab" type="button" role="tab" data-id="' + f.id + '" aria-selected="' + (f.id === active.id) + '">' + esc(f.label) + '</button>';
  }).join('');
  tabs.addEventListener('click', function(e){
    var btn = e.target.closest('[data-id]');
    if (!btn) return;
    var feed = FEEDS.find(function(f){ return f.id === btn.dataset.id; });
    if (feed) show(feed);
  });

  show(active);
})();
</script>
</body>
</html>

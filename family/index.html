<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family — Steven Philley</title>
<meta name="description" content="Family photographs from the Philley albums.">
<link rel="canonical" href="https://stevenphilley.com/family/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Steven Philley">
<meta property="og:title" content="Family — Steven Philley">
<meta property="og:description" content="Family photographs from the Philley albums.">
<meta property="og:url" content="https://stevenphilley.com/family/">
<meta property="og:image" content="https://stevenphilley.com/family/img/grandma.jpg">
<script>(function(){try{var t=localStorage.getItem('sp-theme');if(t&&['dusk','sage','tide','sand','neon'].indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{background:var(--base-2,#14161c);color:var(--ink,#e8e6e1)}
.f-wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 72px}
.e-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line,#2c303a);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.e-top a{color:var(--ink-soft,#9b9a96);text-decoration:none}
.e-top a:hover,.e-top a[aria-current="page"]{color:inherit}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent,#c8b48a);margin:28px 0 10px}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(52px,11vw,108px);line-height:.88;margin:0}
.lede{max-width:56ch;margin:16px 0 0;font-family:"IBM Plex Mono",monospace;font-size:13.5px;line-height:1.7;color:var(--ink-soft,#9b9a96)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
@media (max-width:820px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.card{display:block;border:1px solid var(--line,#2c303a);background:rgba(0,0,0,.18);text-decoration:none;color:inherit;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.card span{display:block;padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--ink-soft,#9b9a96)}
.card:hover span{color:var(--ink,#e8e6e1)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:24px;z-index:40}
.lightbox.on{display:flex}
.lightbox img{max-width:min(1100px,96vw);max-height:88vh;object-fit:contain}
.lightbox button{position:absolute;top:16px;right:18px;appearance:none;background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;cursor:pointer}
.e-foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line,#2c303a);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;display:flex;gap:16px;flex-wrap:wrap}
.e-foot a{color:var(--ink-soft,#9b9a96);text-decoration:none}
.themes{display:flex;border:1px solid var(--line,#2c303a)}
.themes button{appearance:none;background:transparent;border:0;border-right:1px solid var(--line,#2c303a);color:var(--muted,#63666e);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;padding:5px 10px;cursor:pointer;text-transform:uppercase}
.themes button:last-child{border-right:0}
.themes button[aria-pressed="true"]{color:var(--base-2,#14161c);background:var(--ink,#e8e6e1)}
</style>
</head>
<body>
<div class="f-wrap">
  <div class="e-top">
    <a href="/">Steven Philley</a>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <a href="/family/" aria-current="page">Family</a>
      <a href="/sitemap.html">Site contents</a>
      <div class="themes" role="group" aria-label="Color theme">
        <button type="button" data-set-theme="dusk">Dusk</button>
        <button type="button" data-set-theme="sage">Sage</button>
        <button type="button" data-set-theme="tide">Tide</button>
        <button type="button" data-set-theme="sand">Sand</button>
        <button type="button" data-set-theme="neon">Neon</button>
      </div>
    </div>
  </div>
  <p class="kicker">Family album</p>
  <h1>Family</h1>
  <p class="lede">Eleven photographs from the Philley albums. Click any frame for the full picture.</p>
  <div class="grid" id="grid"></div>
  <footer class="e-foot">
    <a href="/">Photography</a>
    <a href="/local/">Local</a>
    <a href="/sitemap.html">Site contents</a>
  </footer>
</div>
<div class="lightbox" id="lb" hidden>
  <button type="button" id="close">Close</button>
  <img id="lbImg" alt="">
</div>
<script>
(function(){
  var KEY='sp-theme';
  var root=document.documentElement;
  var buttons=[].slice.call(document.querySelectorAll('[data-set-theme]'));
  function paint(){var c=root.getAttribute('data-theme')||'dusk';buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.setTheme===c));});}
  buttons.forEach(function(b){b.addEventListener('click',function(){root.setAttribute('data-theme',b.dataset.setTheme);try{localStorage.setItem(KEY,b.dataset.setTheme);}catch(e){}paint();});});
  paint();

  var photos=[
    {src:'img/kitchen-01.jpg', label:'Kitchen party'},
    {src:'img/kitchen-02.jpg', label:'Kitchen party'},
    {src:'img/kitchen-03.jpg', label:'Kitchen party'},
    {src:'img/kitchen-04.jpg', label:'Kitchen party'},
    {src:'img/kitchen-group.jpg', label:'Kitchen group'},
    {src:'img/bench-group.jpg', label:'Outdoor bench'},
    {src:'img/daniel.jpg', label:'Daniel'},
    {src:'img/grandma.jpg', label:'Grandma'},
    {src:'img/graduation.jpg', label:'Graduation'},
    {src:'img/vintage-dresses.jpg', label:'Vintage'},
    {src:'img/vintage-bw.jpg', label:'Black and white'}
  ];
  var grid=document.getElementById('grid');
  var lb=document.getElementById('lb');
  var lbImg=document.getElementById('lbImg');
  grid.innerHTML=photos.map(function(p,i){
    return '<a class="card" href="'+p.src+'" data-i="'+i+'"><img src="'+p.src+'" alt="'+p.label+'" loading="lazy"><span>'+p.label+'</span></a>';
  }).join('');
  function open(i){
    var p=photos[i];
    lbImg.src=p.src; lbImg.alt=p.label;
    lb.hidden=false; lb.classList.add('on');
  }
  function close(){ lb.classList.remove('on'); lb.hidden=true; lbImg.removeAttribute('src'); }
  grid.addEventListener('click',function(e){
    var a=e.target.closest('a');
    if(!a) return;
    e.preventDefault();
    open(+a.dataset.i);
  });
  document.getElementById('close').addEventListener('click', close);
  lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader — Steven Philley</title>
<meta name="description" content="Markdown reader with site themes — sticky TOC, progress, and comfortable type. Default: Owned Pipelines dissertation draft.">
<link rel="canonical" href="https://stevenphilley.com/reader/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Steven Philley">
<meta property="og:title" content="Reader — Markdown with site themes">
<meta property="og:description" content="Live Markdown reader for stevenphilley.com — neon / emerald / dusk / sage / tide / sand, sticky TOC, reading progress.">
<meta property="og:url" content="https://stevenphilley.com/reader/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Reader — Steven Philley">
<meta name="twitter:description" content="Markdown reader with site themes, TOC, and reading progress.">
<script src="/js/sp-theme-boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/reader/reader.css">
</head>
<body>
<a class="skip-link" href="#rd-article">Skip to document</a>
<div id="rd-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Reading progress"></div>

<header class="rd-top">
  <div class="rd-top-left">
    <a class="rd-home" href="/">Steven Philley</a>
    <span class="rd-kicker">Markdown <strong>reader</strong></span>
  </div>
  <div class="rd-top-right">
    <div class="themes" role="group" aria-label="Color theme">
      <button type="button" class="swatch sw-neon" data-set-theme="neon" aria-pressed="true" title="Neon" aria-label="Neon theme"></button>
      <button type="button" class="swatch sw-emerald" data-set-theme="emerald" aria-pressed="false" title="Emerald" aria-label="Emerald theme"></button>
      <button type="button" class="swatch sw-dusk" data-set-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk theme"></button>
      <button type="button" class="swatch sw-sage" data-set-theme="sage" aria-pressed="false" title="Sage" aria-label="Sage theme"></button>
      <button type="button" class="swatch sw-tide" data-set-theme="tide" aria-pressed="false" title="Tide" aria-label="Tide theme"></button>
      <button type="button" class="swatch sw-sand" data-set-theme="sand" aria-pressed="false" title="Sand" aria-label="Sand theme"></button>
    </div>
    <div class="rd-font" role="group" aria-label="Font size">
      <button type="button" id="rd-font-minus" aria-label="Decrease font size">A−</button>
      <span id="rd-font-label">18px</span>
      <button type="button" id="rd-font-plus" aria-label="Increase font size">A+</button>
    </div>
    <button type="button" class="rd-icon-btn rd-toc-btn" id="rd-toc-toggle" aria-controls="rd-toc-drawer">Contents</button>
  </div>
</header>

<div class="rd-shell">
  <aside class="rd-sidebar" aria-label="Table of contents">
    <h2>Contents</h2>
    <p id="rd-toc-empty">Loading…</p>
    <nav id="rd-toc"></nav>
  </aside>

  <main class="rd-main">
    <div class="rd-toolbar">
      <h1 id="rd-doc-title">Document</h1>
      <span id="rd-picker-wrap">
        <label class="visually-hidden" for="rd-doc-picker" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Document</label>
        <select id="rd-doc-picker" aria-label="Choose document"></select>
      </span>
      <a class="rd-link" id="rd-download" href="#" download>Download .md</a>
      <a class="rd-link" id="rd-raw" href="#" target="_blank" rel="noopener">Raw</a>
    </div>
    <p id="rd-status" role="status" aria-live="polite"></p>
    <article id="rd-article" class="rd-article" aria-busy="true"></article>
    <p class="rd-foot">
      Allowlisted paths only ·
      <a href="/dissertation/">Dissertation reader</a> ·
      <a href="/sitemap.html">Sitemap</a>
    </p>
  </main>
</div>

<div id="rd-toc-drawer" hidden aria-hidden="true">
  <div id="rd-toc-backdrop"></div>
  <div class="rd-toc-panel" role="dialog" aria-label="Table of contents">
    <header>
      <h2>Contents</h2>
      <button type="button" class="rd-icon-btn" id="rd-toc-close">Close</button>
    </header>
    <nav id="rd-toc-mobile"></nav>
  </div>
</div>

<script>
window.SP_MD_READER = {
  defaultDoc: "/dissertation/Owned_Pipelines_Draft_1.2.md",
  lockDoc: false,
  allowlist: [
    { path: "/dissertation/Owned_Pipelines_Draft_1.2.md", label: "Owned Pipelines — Draft 1.2" },
    { path: "/README.md", label: "Site README" },
    { path: "/local/NEWS_ARCHIVE.md", label: "Local news archive" }
  ]
};
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu" crossorigin="anonymous"></script>
<script src="/js/sp-md-reader.js"></script>
<script src="/js/sp-share.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<!-- Open Graph / Mastodon / Twitter -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{{ page.image | default: site.image | absolute_url }}" />
<meta property="og:image:alt" content="{{ page.image_alt | default: site.description }}" />
<meta name="twitter:card" content="summary_large_image" />

<!-- Apply the saved theme before first paint so there's no flash -->
<script>
(function () {
  try {
    var t = localStorage.getItem('sp-theme');
    if (t && ['dusk', 'sage', 'tide', 'sand'].indexOf(t) > -1) {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
</head>

<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="border-left" aria-hidden="true"></div>
<div class="border-right" aria-hidden="true"></div>

<div class="page-wrap">

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

</div>

</body>
</html>

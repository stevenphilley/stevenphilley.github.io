<header>

  <div class="header-top">
    <span class="issue-label">{{ page.kicker | default: site.kicker }}</span>

    <div class="header-top-right">
      <span class="issue-label issue-label--domain">stevenphilley.com</span>
      <div class="themes" role="group" aria-label="Colour theme">
        <button type="button" class="swatch sw-dusk" data-set="dusk" aria-pressed="true"  title="Dusk"><span class="vh">Dusk</span></button>
        <button type="button" class="swatch sw-sage" data-set="sage" aria-pressed="false" title="Sage"><span class="vh">Sage</span></button>
        <button type="button" class="swatch sw-tide" data-set="tide" aria-pressed="false" title="Tide"><span class="vh">Tide</span></button>
        <button type="button" class="swatch sw-sand" data-set="sand" aria-pressed="false" title="Sand"><span class="vh">Sand</span></button>
      </div>
    </div>
  </div>

  <div class="masthead">
    <a class="site-title" href="{{ '/' | relative_url }}">Steven<br>Philley</a>
    <div class="masthead-right">
      <p class="tagline">{{ page.tagline | default: site.tagline }}</p>
      <div class="vert-rule"></div>
      <p class="sub-tagline">{{ page.subtagline | default: "Landscape &amp; Natural Light" }}</p>
    </div>
  </div>

  {% if site.nav and site.nav.size > 0 %}
  <nav class="site-nav" aria-label="Sections">
    {% for item in site.nav %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {% endfor %}
  </nav>
  {% endif %}

</header>
